; ESP32 CAN sniffer & payment-system emulator for the Franke FM850
; Build:   pio run -e esp32dev            (or esp32-s3-devkitc-1 / esp32-c3-devkitm-1)
; Flash:   pio run -e esp32dev -t upload
; Tests:   pio test -e native              (needs a host gcc/g++ in PATH, e.g. MSYS2 / WinLibs)

[platformio]
default_envs = esp32dev

; ---- shared settings for all ESP32 boards -------------------------------
[esp32_common]
platform = espressif32@6.7.0          ; Arduino-ESP32 2.0.16 / ESP-IDF 4.4 (driver/twai.h)
framework = arduino
monitor_speed = 921600
monitor_filters = send_on_enter
monitor_eol = CR
extra_scripts =
    pre:tools/embed_web.py       ; web/index.html -> src/generated/web_index_html.h
    post:tools/copy_firmware.py  ; .bin -> firmware/franke-can_<env>.bin (for OTA upload)
lib_deps =
    esp32async/AsyncTCP@3.3.2
    esp32async/ESPAsyncWebServer@3.6.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0              ; no IDF log output on the host port (would corrupt SLCAN)
    -DENABLE_WIFI=1                   ; WLAN + web UI + OTA + TCP; 0 = USB only
    -Wall

; Classic ESP32 DevKit: USB goes through a CP210x/CH340 UART bridge -> 921600 baud
; 4 MB boards use "min_spiffs": 2 x 1.875 MB app slots (OTA) + 128 KB LittleFS for scripts/results.
; NVS (settings) stays at the same address. Changing the partition table needs ONE USB flash.
[env:esp32dev]
extends = esp32_common
board = esp32dev
board_build.partitions = min_spiffs.csv
upload_speed = 921600

; ESP32-S3 DevKitC-1: native USB (USB-Serial/JTAG, "USB" port of the board)
[env:esp32-s3-devkitc-1]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 DevKitM-1: native USB-Serial/JTAG
[env:esp32-c3-devkitm-1]
extends = esp32_common
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- host unit tests (SLCAN codec + rule engine, lib/franke_core) -------
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
