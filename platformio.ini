; ESP32 CAN sniffer & payment-system emulator for the Franke FM850 - ESP-IDF firmware
; Build:   pio run -e esp32dev            (or esp32-s3-devkitc-1 / esp32-c3-devkitm-1)
; Flash:   pio run -e esp32dev -t upload  (writes bootloader + partition table + app)
; Config:  pio run -e esp32dev -t menuconfig   (then update sdkconfig.defaults, see README)
; Tests:   pio test -e native              (needs a host gcc/g++ in PATH, e.g. MSYS2 / WinLibs)

[platformio]
default_envs = esp32dev

; ---- shared settings for all ESP32 boards -------------------------------
[esp32_common]
platform = espressif32@6.7.0          ; ESP-IDF 5.2.1
framework = espidf
monitor_speed = 921600
monitor_filters = send_on_enter
monitor_eol = CR
; one partition table for all 4 MB boards: same layout as before (NVS keeps its address)
board_build.partitions = partitions.csv
extra_scripts =
    pre:tools/embed_web.py       ; web/index.html -> src/generated/web_index_html.h
    post:tools/copy_firmware.py  ; .bin -> firmware/franke-can_<env>.bin (for OTA upload)
; lib/franke_core is compiled by CMake as part of the app (src/CMakeLists.txt), not by PlatformIO
lib_ignore = franke_core
build_flags =
    -Wall

; Classic ESP32 DevKit: USB goes through a CP210x/CH340 UART bridge (UART0) -> 921600 baud
[env:esp32dev]
extends = esp32_common
board = esp32dev
upload_speed = 921600

; ESP32-S3 DevKitC-1: native USB (USB-Serial/JTAG, "USB" port of the board)
[env:esp32-s3-devkitc-1]
extends = esp32_common
board = esp32-s3-devkitc-1

; ESP32-C3 DevKitM-1: native USB-Serial/JTAG
[env:esp32-c3-devkitm-1]
extends = esp32_common
board = esp32-c3-devkitm-1

; ---- host unit tests (SLCAN codec + rule engine, lib/franke_core) -------
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
